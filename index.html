<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <p class="eyebrow">Exercício de HTML + CSS</p>
            <h1>Tabela de Produtos</h1>
            <p>Uma evolução do meu primeiro exercício com tabelas HTML.</p>
        </header>

        <div class="table-wrapper">
            <table>
                <caption>Produtos disponíveis na loja</caption>
                <thead>
                    <tr>
                        <th scope="col">Roupa</th>
                        <th scope="col">Cor</th>
                        <th scope="col">Tamanho</th>
                        <th scope="col">Preço</th>
                        <th scope="col">Disponibilidade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Camiseta</td>
                        <td>Vermelha</td>
                        <td>M</td>
                        <td>R$ 70,00</td>
                        <td><span class="status available">Em estoque</span></td>
                    </tr>
                    <tr>
                        <td>Calça Jeans</td>
                        <td>Vermelha</td>
                        <td>M</td>
                        <td>R$ 160,00</td>
                        <td><span class="status unavailable">Esgotado</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
